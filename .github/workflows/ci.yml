name: AttualPlay CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: attualplay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify Vercel secrets are configured
        shell: bash
        run: |
          echo "VERCEL_TOKEN configured: ${HAS_VERCEL_TOKEN}"
          echo "VERCEL_ORG_ID configured: ${HAS_VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID configured: ${HAS_VERCEL_PROJECT_ID}"
          test "${HAS_VERCEL_TOKEN}" = "true"
          test "${HAS_VERCEL_ORG_ID}" = "true"
          test "${HAS_VERCEL_PROJECT_ID}" = "true"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build
