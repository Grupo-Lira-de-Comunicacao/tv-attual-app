limit_conn_zone $binary_remote_addr zone=tvattual_per_ip:10m;
server {
  listen 8080;
  server_name _;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://tvattual.com.br https://www.tvattual.com.br" always;
  add_header Cache-Control "no-store" always;
  root /usr/share/nginx/html;
  index index.html;
  location = /health {
    default_type text/plain;
    return 200 'ok';
  }
  location = /status.json {
    proxy_pass http://status:8090/status;
    proxy_read_timeout 5s;
    proxy_set_header Host $host;
  }
  location /hls/ {
    limit_conn tvattual_per_ip 12;
    proxy_pass http://origin:8888/;
    # Keep MediaMTX cookie-check redirects on the public HTTPS origin.
    proxy_redirect /tvattual-live/ https://live.tvattual.com.br/hls/tvattual-live/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store" always;
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
