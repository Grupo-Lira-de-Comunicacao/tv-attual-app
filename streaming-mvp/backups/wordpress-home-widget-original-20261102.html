<style>
.attual-live-player {
    width: 100%;
    max-width: 850px;
    margin: 20px auto;
    padding: 16px;
    background: linear-gradient(145deg, rgba(15, 28, 46, 0.97), rgba(5, 14, 27, 0.97));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    box-sizing: border-box;
    font-family: Manrope, Arial, sans-serif;
}

.attual-live-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 4px 4px 14px;
}

.attual-live-brand {
    min-width: 0;
}

.attual-live-name {
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
}

.attual-live-subtitle {
    margin-top: 4px;
    color: rgba(255,255,255,0.58);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
}

.attual-live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 7px 12px;
    color: #ffffff;
    background: rgba(255, 23, 79, 0.12);
    border: 1px solid rgba(255, 23, 79, 0.32);
    border-radius: 30px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.attual-live-dot {
    width: 8px;
    height: 8px;
    background: #ff174f;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,23,79,0.9);
    animation: attualPulse 1.5s infinite;
}

@keyframes attualPulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.45;
        transform: scale(0.8);
    }
}

.attual-video-frame {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #000000;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 13px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}

.attual-video-frame video {
    display: block;
    width: 100%;
    height: auto;
    background: #000000;
    border: 0;
}

.attual-live-footer {
    padding: 13px 4px 2px;
    color: rgba(255,255,255,0.58);
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.2px;
}

@media (max-width: 600px) {
    .attual-live-player {
        margin: 10px auto;
        padding: 11px;
        border-radius: 14px;
    }

    .attual-live-header {
        gap: 8px;
        padding-bottom: 11px;
    }

    .attual-live-name {
        font-size: 15px;
    }

    .attual-live-subtitle {
        font-size: 9px;
    }

    .attual-live-badge {
        padding: 6px 9px;
        gap: 5px;
        font-size: 9px;
    }

    .attual-live-dot {
        width: 7px;
        height: 7px;
    }
}

@media (max-width: 420px) {
    .attual-live-subtitle {
        display: none;
    }

    .attual-live-name {
        font-size: 14px;
    }
}
</style>

<div class="attual-live-player">

    <div class="attual-live-header">

        <div class="attual-live-brand">
            <div class="attual-live-name">
                TV Attual
            </div>

            <div class="attual-live-subtitle">
                A informação que faz a diferença
            </div>
        </div>

        <div class="attual-live-badge">
            <span class="attual-live-dot"></span>
            AO VIVO
        </div>

    </div>

    <div class="attual-video-frame">

        <video
            id="videoTV"
            controls
            autoplay
            muted
            playsinline
            preload="auto">
        </video>

    </div>

    <div class="attual-live-footer">
        TV Attual • Vale do Paraíba e Litoral
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
(function () {

    function iniciarTVAttual() {

        var video = document.getElementById('videoTV');

        if (!video) {
            return;
        }

        var videoSrc =
            'https://tv.tvattual.com.br/iptv/channel/1.m3u8';

        if (window.Hls && Hls.isSupported()) {

            var hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });

            hls.loadSource(videoSrc);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(function () {});
            });

            hls.on(Hls.Events.ERROR, function (event, data) {

                if (!data.fatal) {
                    return;
                }

                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;

                    default:
                        hls.destroy();
                        break;
                }

            });

        } else if (
            video.canPlayType('application/vnd.apple.mpegurl')
        ) {

            video.src = videoSrc;

            video.addEventListener('loadedmetadata', function () {
                video.play().catch(function () {});
            });

        }

    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarTVAttual);
    } else {
        iniciarTVAttual();
    }

})();
</script>
