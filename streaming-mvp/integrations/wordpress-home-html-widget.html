<!-- TV Attual - Home Elementor HTML widget. Keep the existing visual identity. -->
<style>
.attual-live-player {
    width: 100%;
    max-width: 850px;
    margin: 20px auto;
    padding: 16px;
    background: linear-gradient(145deg, rgba(15, 28, 46, 0.97), rgba(5, 14, 27, 0.97));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    box-sizing: border-box;
    font-family: Manrope, Arial, sans-serif;
}
.attual-live-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 4px 4px 14px;
}
.attual-live-brand { min-width: 0; }
.attual-live-name {
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
}
.attual-live-subtitle {
    margin-top: 4px;
    color: rgba(255,255,255,0.58);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
}
.attual-live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 7px 12px;
    color: #ffffff;
    background: rgba(255, 23, 79, 0.12);
    border: 1px solid rgba(255, 23, 79, 0.32);
    border-radius: 30px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
}
.attual-live-dot {
    width: 8px;
    height: 8px;
    background: #ff174f;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,23,79,0.9);
    animation: attualPulse 1.5s infinite;
}
.attual-live-badge.is-programacao {
    background: rgba(45,125,255,0.12);
    border-color: rgba(45,125,255,0.32);
}
.attual-live-badge.is-programacao .attual-live-dot {
    background: #2d7dff;
    box-shadow: 0 0 8px rgba(45,125,255,0.75);
}
@keyframes attualPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
}
.attual-video-frame {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #000000;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 13px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.30);
}
.attual-video-frame iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    background: #000000;
    border: 0;
}
.attual-live-footer {
    padding: 13px 4px 2px;
    color: rgba(255,255,255,0.58);
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.2px;
}
@media (max-width: 600px) {
    .attual-live-player { margin: 10px auto; padding: 11px; border-radius: 14px; }
    .attual-live-header { gap: 8px; padding-bottom: 11px; }
    .attual-live-name { font-size: 15px; }
    .attual-live-subtitle { font-size: 9px; }
    .attual-live-badge { padding: 6px 9px; gap: 5px; font-size: 9px; }
    .attual-live-dot { width: 7px; height: 7px; }
}
@media (max-width: 420px) {
    .attual-live-subtitle { display: none; }
    .attual-live-name { font-size: 14px; }
}
</style>
<div class="attual-live-player" id="attual-home-canal">
    <div class="attual-live-header">
        <div class="attual-live-brand">
            <div class="attual-live-name">TV Attual</div>
            <div class="attual-live-subtitle">A informação que faz a diferença</div>
        </div>
        <div class="attual-live-badge is-programacao" id="attual-home-badge">
            <span class="attual-live-dot"></span>
            <span id="attual-home-estado">TV 24 HORAS</span>
        </div>
    </div>
    <div class="attual-video-frame">
        <iframe
            id="attual-unified-iframe"
            src="https://live.tvattual.com.br/?embed=1"
            title="TV Attual — programação 24 horas e transmissões ao vivo"
            loading="eager"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div class="attual-live-footer">TV Attual • Vale do Paraíba e Litoral</div>
</div>
<script>
(function () {
    var iframe = document.getElementById('attual-unified-iframe');
    var badge = document.getElementById('attual-home-badge');
    var label = document.getElementById('attual-home-estado');
    if (!iframe || !badge || !label) return;
    window.addEventListener('message', function (event) {
        if (event.origin !== 'https://live.tvattual.com.br' ||
            event.source !== iframe.contentWindow) return;
        if (!event.data || event.data.type !== 'tvattual:source') return;
        if (event.data.mode !== 'live' && event.data.mode !== 'recorded') return;
        var isLive = event.data.mode === 'live';
        badge.classList.toggle('is-programacao', !isLive);
        label.textContent = isLive ? 'AO VIVO' : 'TV 24 HORAS';
    });
})();
</script>
