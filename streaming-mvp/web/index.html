<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Assista aos programas ao vivo da TV Attual no streaming oficial." />
  <title>TV Attual | Ao vivo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header class="masthead"><span class="brand">TV <strong>ATTUAL</strong></span><span class="subbrand">TRANSMISSÃO OFICIAL</span></header>
    <section class="player" aria-labelledby="streamTitle">
      <div class="player-top"><span id="signal" class="signal offline" role="status" aria-live="polite">FORA DO AR</span><span class="station">Canal TV Attual</span></div>
      <video id="video" controls playsinline preload="none" aria-label="Transmissão ao vivo da TV Attual" hidden></video>
      <div id="standby" class="standby"><div class="tv-icon" aria-hidden="true">TV</div><h1 id="streamTitle">TV Attual</h1><p id="notice">Verificando a transmissão...</p><button id="start" type="button" hidden>Assistir ao vivo</button></div>
    </section>
    <div class="footer"><p>Programas especiais e coberturas ao vivo da TV Attual.</p><button type="button" id="refresh">Verificar sinal</button></div>
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
